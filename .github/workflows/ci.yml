name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      APP_VERSION: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate public configuration
        run: |
          for name in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Variable: $name" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e
        env:
          MAINTENANCE_MODE: 'false'
          SUPABASE_SERVICE_ROLE_KEY: ci-unused-foundation-e2e

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.24.3'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

      # The action's PR API request can cover only its first page of commits.
      - name: Scan complete Git history for secrets
        run: gitleaks git --redact --log-opts=--all .

      - name: Scan client bundle for server-only markers
        run: |
          test -d .next/static
          status=0
          grep --recursive --fixed-strings --quiet \
            -e 'ci-unused-foundation-e2e' \
            -e 'SUPABASE_SERVICE_ROLE_KEY' \
            .next/static || status=$?
          if [ "$status" -eq 0 ]; then
            echo 'Server-only marker found in client bundle' >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo 'Client bundle scan failed' >&2
            exit "$status"
          fi

      - name: Build Docker image
        run: |
          build_args=(
            --build-arg NEXT_PUBLIC_SITE_URL
            --build-arg NEXT_PUBLIC_SUPABASE_URL
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY
            --build-arg APP_VERSION
          )
          if [ -n "$NEXT_PUBLIC_SENTRY_DSN" ]; then
            build_args+=(--build-arg NEXT_PUBLIC_SENTRY_DSN)
          fi
          docker build -f deploy/Dockerfile "${build_args[@]}" .

  db-types:
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: ci-supabase-types
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated database types
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'Missing Supabase database types configuration' >&2
            exit 1
          fi
          trap 'rm -f .env' EXIT
          : > .env
          npm run db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts
