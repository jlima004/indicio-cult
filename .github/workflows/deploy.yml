name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: indicio-cult-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 105

    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_HEALTH_URL }}
      COOLIFY_CONFIG_TOKEN: ${{ secrets.COOLIFY_CONFIG_TOKEN }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            CANDIDATE_SHA \
            COOLIFY_API_URL \
            COOLIFY_APP_UUID \
            COOLIFY_HEALTH_URL \
            COOLIFY_CONFIG_TOKEN \
            COOLIFY_DEPLOY_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing deployment configuration: $name" >&2
              exit 1
            fi
          done

          case "$COOLIFY_API_URL" in
            https://*) ;;
            *)
              echo "COOLIFY_API_URL must use HTTPS." >&2
              exit 1
              ;;
          esac

          case "$COOLIFY_HEALTH_URL" in
            https://*) ;;
            *)
              echo "COOLIFY_HEALTH_URL must use HTTPS." >&2
              exit 1
              ;;
          esac

      - name: Reject superseded candidate
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_main_sha="$(
            curl \
              --fail \
              --silent \
              --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" |
              jq -r '.object.sha'
          )"

          if [ -z "$current_main_sha" ] || [ "$current_main_sha" = "null" ]; then
            echo "Could not resolve current main SHA." >&2
            exit 1
          fi

          echo "candidate_sha=$CANDIDATE_SHA"
          echo "current_main_sha=$current_main_sha"

          if [ "$current_main_sha" != "$CANDIDATE_SHA" ]; then
            echo "Candidate is superseded. No production mutation will occur."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Pin candidate SHA in Coolify
        if: steps.guard.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          payload="$(
            jq -nc \
              --arg sha "$CANDIDATE_SHA" \
              '{git_commit_sha: $sha}'
          )"

          curl \
            --proto '=https' \
            --fail-with-body \
            --silent \
            --show-error \
            -X PATCH \
            -H "Authorization: Bearer $COOLIFY_CONFIG_TOKEN" \
            -H "Content-Type: application/json" \
            "$COOLIFY_API_URL/applications/$COOLIFY_APP_UUID" \
            --data "$payload" \
            > /dev/null

      - name: Verify pinned SHA
        if: steps.guard.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          application="$(
            curl \
              --proto '=https' \
              --fail \
              --silent \
              --show-error \
              -H "Authorization: Bearer $COOLIFY_CONFIG_TOKEN" \
              "$COOLIFY_API_URL/applications/$COOLIFY_APP_UUID"
          )"

          configured_sha="$(
            printf '%s' "$application" |
              jq -r '.git_commit_sha // empty'
          )"

          echo "candidate_sha=$CANDIDATE_SHA"
          echo "configured_git_commit_sha=$configured_sha"

          if [ "$configured_sha" != "$CANDIDATE_SHA" ]; then
            echo "Coolify commit pin does not match candidate SHA." >&2
            exit 1
          fi

      - name: Trigger Coolify deployment
        if: steps.guard.outputs.deploy == 'true'
        id: trigger
        shell: bash
        run: |
          set -euo pipefail

          response="$(
            curl \
              --proto '=https' \
              --fail-with-body \
              --silent \
              --show-error \
              -X POST \
              -H "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
              "$COOLIFY_API_URL/deploy?uuid=$COOLIFY_APP_UUID"
          )"

          deployment_uuid="$(
            printf '%s' "$response" |
              jq -r '.deployments[0].deployment_uuid // empty'
          )"

          if [ -z "$deployment_uuid" ]; then
            echo "Coolify did not return a deployment UUID." >&2
            exit 1
          fi

          echo "deployment_uuid=$deployment_uuid"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for Coolify deployment
        if: steps.guard.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 180); do
            response_file="$(mktemp)"

            http_code="$(
              curl \
                --proto '=https' \
                --silent \
                --show-error \
                --max-time 10 \
                --output "$response_file" \
                --write-out '%{http_code}' \
                -H "Authorization: Bearer $COOLIFY_CONFIG_TOKEN" \
                "$COOLIFY_API_URL/deployments/$DEPLOYMENT_UUID" \
                || true
            )"

            if [ "$http_code" = "200" ]; then
              status="$(jq -r '.status // empty' "$response_file")"
              commit="$(jq -r '.commit // empty' "$response_file")"

              echo "Coolify deployment status: $status"

              case "$status" in
                finished)
                  rm -f "$response_file"

                  if [ "$commit" != "$CANDIDATE_SHA" ]; then
                    echo "Deployment commit mismatch." >&2
                    echo "candidate_sha=$CANDIDATE_SHA" >&2
                    echo "deployment_commit=$commit" >&2
                    exit 1
                  fi

                  echo "deployment_commit=$commit"
                  exit 0
                  ;;

                failed|cancelled|cancelled-by-user|error)
                  rm -f "$response_file"
                  echo "Coolify deployment ended with status: $status" >&2
                  exit 1
                  ;;
              esac
            elif [ "$http_code" != "404" ]; then
              rm -f "$response_file"
              echo "Coolify deployment lookup failed with HTTP $http_code." >&2
              exit 1
            fi

            rm -f "$response_file"
            sleep 10
          done

          echo "Timed out waiting for Coolify deployment." >&2
          exit 1

      - name: Verify production health and release identity
        if: steps.guard.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 90); do
            response_file="$(mktemp)"

            http_code="$(
              curl \
                --proto '=https' \
                --silent \
                --show-error \
                --max-time 10 \
                --output "$response_file" \
                --write-out '%{http_code}' \
                "$COOLIFY_HEALTH_URL" \
                || true
            )"

            if [ "$http_code" = "200" ]; then
              if jq -e \
                --arg sha "$CANDIDATE_SHA" \
                '.status == "ok" and
                 .supabase == "ok" and
                 .version == $sha' \
                "$response_file" > /dev/null
              then
                echo "Production health matches candidate SHA."
                jq '{status, supabase, version}' "$response_file"
                rm -f "$response_file"
                exit 0
              fi
            fi

            rm -f "$response_file"
            sleep 10
          done

          echo "Production health never converged to the candidate SHA." >&2
          exit 1

      - name: Verify production security headers
        if: steps.guard.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          base_url="${COOLIFY_HEALTH_URL%/api/health}"
          headers_file="$(mktemp)"

          curl \
            --proto '=https' \
            --fail \
            --silent \
            --show-error \
            --dump-header "$headers_file" \
            --output /dev/null \
            "$base_url/"

          for header in \
            strict-transport-security \
            x-content-type-options \
            referrer-policy \
            permissions-policy
          do
            if ! grep --ignore-case --quiet "^${header}:" "$headers_file"; then
              rm -f "$headers_file"
              echo "Missing production security header: $header" >&2
              exit 1
            fi
          done

          rm -f "$headers_file"
          echo "Production security headers verified."

      - name: Warm production Home
        if: steps.guard.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          base_url="${COOLIFY_HEALTH_URL%/api/health}"

          http_code="$(
            curl \
              --proto '=https' \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$base_url/"
          )"

          if [ "$http_code" != "200" ]; then
            echo "Production Home returned HTTP $http_code." >&2
            exit 1
          fi

          echo "Production Home warmed successfully."

      - name: Deployment summary
        if: steps.guard.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          {
            echo "## Indicio Cult production deployment"
            echo
            echo "- candidate_sha: \`$CANDIDATE_SHA\`"
            echo "- deployment_uuid: \`$DEPLOYMENT_UUID\`"
            echo "- health: \`$COOLIFY_HEALTH_URL\`"
            echo "- result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
