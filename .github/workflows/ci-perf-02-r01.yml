name: CI-PERF-02-R01 isolated npm diagnostic

on:
  push:
    branches:
      - chore/ci-perf-02-r01-diagnostics
    paths:
      - .github/workflows/ci-perf-02-r01.yml
      - tasks/ci-perf-02-r01/measure.py

permissions:
  contents: read

concurrency:
  group: ci-perf-02-r01-diagnostics
  cancel-in-progress: false

jobs:
  diagnostic-original:
    # The operator must analyze run 1 before authorizing any second push.
    # This guard also rejects manual reruns; it is not permission for extra pushes.
    if: github.run_attempt == 1 && github.run_number <= 2
    runs-on: ubuntu-latest
    steps:
      - name: Start diagnostic clock
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/r01-public"
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'r01-start.json').write_text(json.dumps({
              'start_ns': time.monotonic_ns(),
              'started_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
          }))
          PY

      - name: Check out reviewed diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Check out fixed measurement baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9249a1efe8c1703408a2ebb9828d41341dd6cd74
          path: baseline
          persist-credentials: false

      - name: Start Node setup clock
        run: python3 -c 'import os,time; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "r01-node-start").write_text(str(time.monotonic_ns()))'

      - name: Set up baseline Node without cache writes
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: baseline/.nvmrc
          package-manager-cache: false

      - name: Verify runtime and start cache clock
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.1
          test "$(npm --version)" = 10.9.8
          test "$(node -p process.arch)" = x64
          test "$(npm config get cache)" = /home/runner/.npm
          test "$(sha256sum baseline/package-lock.json | cut -d ' ' -f 1)" = 2a6e6077d46d953ee4fbeac8a776d3e0d0c79f996edcca7e3c045c740bf8d14b
          python3 -c 'import os,time; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "r01-cache-start").write_text(str(time.monotonic_ns()))'

      - name: Restore existing CI npm cache without saving
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /home/runner/.npm
          key: node-cache-Linux-x64-npm-${{ hashFiles('baseline/package-lock.json') }}

      - name: Record allowlisted workflow context
        shell: bash
        env:
          HARNESS_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          now = time.monotonic_ns()
          start = json.loads((root / 'r01-start.json').read_text())
          node_start = int((root / 'r01-node-start').read_text())
          cache_start = int((root / 'r01-cache-start').read_text())
          sha = os.environ['HARNESS_SHA']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          key_pattern = r'node-cache-Linux-x64-npm-[0-9a-f]{64}'
          for name in ('CACHE_KEY', 'CACHE_MATCHED_KEY'):
              assert not os.environ[name] or re.fullmatch(key_pattern, os.environ[name])
          baseline = '9249a1efe8c1703408a2ebb9828d41341dd6cd74'
          tree = subprocess.check_output(['git', '-C', 'baseline', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert re.fullmatch('[0-9a-f]{40}', tree)
          context = {
              'harness_sha': sha, 'runner_event_sha': sha, 'baseline_sha': baseline,
              'baseline_tree': tree, 'run_id': int(os.environ['RUN_ID']),
              'started_utc': start['started_utc'],
              'pre_node_setup_seconds': (node_start - start['start_ns']) / 1e9,
              'node_setup_and_verification_seconds': (cache_start - node_start) / 1e9,
              'cache_restore_and_step_transition_seconds': (now - cache_start) / 1e9,
              'pre_install_total_seconds': (now - start['start_ns']) / 1e9,
              'cache_hit': os.environ['CACHE_HIT'] == 'true',
              'cache_key': os.environ['CACHE_KEY'], 'cache_matched_key': os.environ['CACHE_MATCHED_KEY'],
              'restored_bytes': None, 'runner_image': None, 'runner_provisioner': None,
              'runner_region': None,
              'metadata_note': 'Exact restore bytes and runner identity must be reconciled from public Actions job setup/cache logs; null means not observed here.',
          }
          (root / 'r01-public/workflow-context.json').write_text(json.dumps(context, indent=2) + '\n')
          PY

      - name: Measure one original npm ci sample
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/tasks/ci-perf-02-r01/measure.py \
            --work "$GITHUB_WORKSPACE/baseline" \
            --cache /home/runner/.npm \
            --output "$RUNNER_TEMP/r01-public/evidence.json"

      - name: Preserve only sanitized diagnostic JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-perf-02-r01-${{ github.run_id }}-sanitized
          path: |
            ${{ runner.temp }}/r01-public/evidence.json
            ${{ runner.temp }}/r01-public/workflow-context.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
